name: CT - Train and Evaluate Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/train.py"
      - "src/prepare_data.py"
      - "src/evaluate.py"
      - "dvc.yaml"
      - "dvc.lock"
      - "params.yaml"
      - "requirements.txt"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Reproduce DVC pipeline
        run: dvc repro
      - name: Evaluate quality gate
        env:
          MIN_F1: "0.90"
        run: python -m src.evaluate --metrics artifacts/metrics.json
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-candidate-${{ github.sha }}
          path: |
            artifacts/model.joblib
            artifacts/metrics.json
            artifacts/feature_names.json
            artifacts/model_version.json
            artifacts/versions/
            mlruns/
            if-no-files-found: error
          retention-days: 14
