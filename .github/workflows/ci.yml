name: CI - Test and Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Reproduce DVC pipeline
        run: dvc repro
      - name: Dependency audit
        # DVC depends on diskcache 5.6.3; PYSEC-2026-2447 has no fixed release yet.
        run: pip-audit --ignore-vuln PYSEC-2026-2447
      - name: Build Docker image
        run: |
          docker build -t mlops-demo:${{ github.sha }} .
