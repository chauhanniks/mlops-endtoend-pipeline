name: CD - Package and Release Candidate

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release target"
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train and gate candidate
        env:
          MIN_F1: "0.90"
        run: |
          python -m src.train
          python -m src.evaluate --metrics artifacts/metrics.json
      - name: Build release image
        run: docker build -t mlops-demo:${{ github.sha }} .
      - name: Run container and smoke-test staging candidate
        run: |
          docker run --detach --name mlops-demo -p 8000:8000 mlops-demo:${{ github.sha }}
          cleanup() { docker logs mlops-demo || true; docker rm -f mlops-demo || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
      - name: Save image archive
        run: docker save mlops-demo:${{ github.sha }} -o mlops-demo-image.tar
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            mlops-demo-image.tar
            artifacts/metrics.json
            artifacts/feature_names.json
          retention-days: 14
      - name: Deployment boundary
        run: |
          echo "Quality gate and container smoke test passed."
          echo "This is ephemeral staging validation on the GitHub runner, not a persistent cloud deployment."
          echo "Add your ECS/EKS/SageMaker deployment and rollback steps here."
